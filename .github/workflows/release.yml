name: Publish launcher and client updates
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New launcher version, e.g. 1.1.1'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test updater and validate launcher
        shell: pwsh
        run: |
          ./tests/Update.Tests.ps1
          ./tests/Repair.Tests.ps1
          ./tests/PlayerExperience.Tests.ps1
          ./tests/NativeLauncher.Tests.ps1
          ./tests/CameraControls.Tests.ps1
          ./tests/Changelog.Tests.ps1
          pwsh -NoProfile -STA -File ./launcher/Play.ps1 -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Launcher validation failed' }
      - name: Prepare release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:REQUESTED_VERSION) { $env:REQUESTED_VERSION } else { $env:GITHUB_REF_NAME.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw 'Invalid version' }
          New-Item -ItemType Directory dist -Force | Out-Null
          gh release download --repo $env:REPOSITORY --pattern update-manifest.json --dir dist
          if (Test-Path dist/update-manifest.json) {
            Move-Item dist/update-manifest.json dist/previous-manifest.json
          }
          gh release download client-patches --repo $env:REPOSITORY --pattern 'client-*.package.json' --dir dist --clobber
          $global:LASTEXITCODE = 0
          ./tools/BuildRelease.ps1 -Repository $env:REPOSITORY -Version $version -MetadataOnly
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -eq 'update-manifest.json' -or $_.Name -like 'launcher-*.zip' -or $_.Name -eq 'MarvelHeroesLauncher-Install.zip' } | ForEach-Object FullName)
          $previous = (gh api "repos/$env:REPOSITORY/releases/latest" | ConvertFrom-Json).tag_name
          gh release create "v$env:RELEASE_VERSION" @assets --repo $env:REPOSITORY --title "Marvel Heroes Launcher $env:RELEASE_VERSION" --notes-file dist/release-notes.txt --draft
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          $manifest = Get-Content dist/update-manifest.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory dist/one-part -Force | Out-Null
          foreach ($package in @($manifest.packages | Where-Object component -in @('client','client-full'))) {
            $parts = if ($package.PSObject.Properties['parts']) { @($package.parts) } else { @([pscustomobject]@{asset=$package.asset;sha256=$package.sha256}) }
            foreach ($part in $parts) {
              gh release download client-patches --repo $env:REPOSITORY --pattern $part.asset --dir dist/one-part --clobber
              if ($LASTEXITCODE -ne 0) { gh release download $previous --repo $env:REPOSITORY --pattern $part.asset --dir dist/one-part --clobber }
              if ($LASTEXITCODE -ne 0) { throw "Missing client asset: $($part.asset)" }
              $local = Join-Path dist/one-part $part.asset
              if ((Get-FileHash -LiteralPath $local -Algorithm SHA256).Hash -ne $part.sha256) { throw "Client asset checksum mismatch: $($part.asset)" }
              gh release upload "v$env:RELEASE_VERSION" $local --repo $env:REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Could not upload client asset: $($part.asset)" }
              Remove-Item -LiteralPath $local -Force
            }
          }
          gh release edit "v$env:RELEASE_VERSION" --repo $env:REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified release.' }
